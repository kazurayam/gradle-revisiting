import com.example.GreetingTask

/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'buildlogic.java-application-conventions'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.commons:commons-text'
    implementation project(':utilities')

    // テストコードでのみ使用するライブラリ
    testImplementation(libs.junit.jupiter.api)
    testRuntimeOnly(libs.junit.jupiter.engine)
}

application {
    // Define the main class for the application.
    mainClass = 'org.example.app.App'
}

tasks.register("showVersion") {
    group = "Help"
    description = "Displays the project version"
    def projectVersion = project.version.toString()
    doLast {
        println("Project version: ${projectVersion}")
    }
}

tasks.register("customGreeting", GreetingTask) {
    group = "Greetings"
    description = "Greets a specific person"
    greeterName = "Gradle User"
}